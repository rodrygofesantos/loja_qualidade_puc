name: CI

on:
  push:
    branches: [main, "feat/**"]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: "3.12"
          - os: ubuntu-latest
            python: "3.14"
          - os: macos-latest
            python: "3.12"
          - os: windows-latest
            python: "3.12"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - run: python -m pip install --disable-pip-version-check -r requirements.txt
      - run: python manage.py migrate --noinput
      - run: python manage.py generate_lab_data
      - run: python manage.py train_risk_model
      - run: python manage.py seed_demo
      - run: python manage.py check
      - run: python -m pytest --cov=loja --cov=laboratorio --cov-report=term-missing --cov-report=json

